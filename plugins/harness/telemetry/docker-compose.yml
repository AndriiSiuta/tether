name: harness-telemetry

services:
  lgtm:
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:3100:3100"
    environment:
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=14d --enable-feature=otlp-deltatocumulative"
      LOKI_EXTRA_ARGS: "-store.retention=14d -compactor.retention-enabled=true -compactor.delete-request-store=filesystem"
      TEMPO_EXTRA_ARGS: "--backend-worker.compaction.block-retention=336h"
    volumes:
      - lgtm-data:/data
      - ./grafana/provisioning/dashboards/harness.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/harness.yaml:ro
      - ./grafana/dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/harness/dashboard.json:ro

volumes:
  lgtm-data:

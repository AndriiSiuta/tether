schema_version: "1.1"
name: spec-writer-stops-without-pattern-row
# Run with --allow-tools Write --scaffold: the spec-writer may write the spec, and scaffold.sh stages the ticket note and
# the codebase in the run's working directory because an add_dirs folder is readable but never announced to the agent.
# The codebase has no store anywhere, so the new store has no existing file to copy.
context:
  scaffold_script: scaffold.sh
